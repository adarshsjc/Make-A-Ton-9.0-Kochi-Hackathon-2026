{% extends "base.html" %}
{% block title %}Password Updated · BrightLoop{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <section class="card" style="width: 100%; max-width: 440px; padding: 40px; border-radius: var(--radius-xl); box-shadow: var(--shadow-hover); text-align: center;">
    <div style="font-size: 40px; margin-bottom: 16px;">✅</div>
    <div class="eyebrow" style="justify-content: center; color:var(--success);">SUCCESS</div>
    <h1 style="font-size: 24px; margin-bottom: 8px;">Password Updated</h1>
    <p class="muted small" style="margin-bottom: 24px; line-height: 1.6;">
      Your account password has been successfully reset. You can now sign in with your new credentials.
    </p>
    <a class="button button-primary" href="{% url 'login' %}" style="width: 100%; padding: 11px;">
      Proceed to Sign In
    </a>
  </section>
</div>
{% endblock %}
